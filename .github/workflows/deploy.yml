name: Deploy to Production Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Setup Cloudflare WARP (IPv6)
        uses: fscarmen/warp-on-actions@v1.4

      - name: Execute Deployment
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            cd /root/novel-api
            git config --global --add safe.directory /root/novel-api
            git config core.fileMode false
            git pull origin main
            
            composer install --optimize-autoloader --no-dev --no-interaction
            php artisan migrate --force
            
            php artisan config:clear
            php artisan route:clear
            php artisan cache:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            
            sudo systemctl reload php8.4-fpm
            
            if systemctl is-active --quiet supervisor; then
                sudo supervisorctl restart all
            fi
            
            chmod -R 775 storage bootstrap/cache
          EOF